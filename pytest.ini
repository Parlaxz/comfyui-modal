[pytest]
markers =
  inference: mark as inference test (deselect with '-m "not inference"')
  execution: mark as execution test (deselect with '-m "not execution"')
  fast_unit: lightweight unit test suitable for the FAST_UNIT guard
  component: local component test requiring more than a fast unit test
  heavy_local: local test that may load heavyweight runtime resources
  remote: test requiring a remote service or paid/external infrastructure
testpaths =
  tests
addopts = -s
pythonpath = .
