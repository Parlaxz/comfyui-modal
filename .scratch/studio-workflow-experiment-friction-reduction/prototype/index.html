<style>

tems:center;border:1px solid var(--line);background:#171c23;padding:12px 14px;margin-bottom:12px;text-align:left}.mode-btn.on{border-color:#347cad;background:var(--blue-soft)}.mode-btn span:last-child{color:var(--muted);font-size:11px}.workflow-strip{padding:13px 15px;border-bottom:1px solid var(--line);background:#101419}.workflow-strip h3{font-size:11px;margin:0 0 9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.workflow-chips{display:flex;flex-wrap:wrap;gap:6px}.workflow-chip,.add-workflow{border:1px solid var(--line);background:#1b222b;padding:7px 9px;font-size:12px}.workflow-chip.selected{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}.workflow-chip span{color:var(--dim);margin-left:4px}.add-workflow{color:var(--amber);border-style:dashed}.compare-note{font-size:11px;color:var(--dim);margin-top:9px}.variant-copy{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--muted)}.variant-copy strong{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}.fields{padding:12px}.field-group{margin-bottom:14px}.group-label{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 5px 7px}.field{border:1px solid var(--line);background:var(--panel2);padding:11px 12px;margin-bottom:7px;transition:.18s border-color,.18s opacity}.field:hover{border-color:#536171}.field.axis{border-color:var(--blue);background:#132332}.field.dim{opacity:.42}.field-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.field-title{display:flex;align-items:center;gap:9px}.field-title strong{font-size:13px}.drag{color:var(--dim);cursor:grab;font-size:17px;line-height:1;user-select:none}.drag:active{cursor:grabbing}.axis-check{font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}.axis-check input{accent-color:var(--blue);vertical-align:-2px}textarea,input[type=number],select{width:100%;border:1px solid #3b4653;background:#0d1116;color:var(--ink);padding:9px 10px;border-radius:0}textarea{min-height:57px;resize:vertical}select{appearance:auto}.axis-editor{border-left:2px solid var(--blue);padding-left:10px}.axis-editor input{margin:0}.entry{display:flex;gap:6px}.entry input{flex:1}.btn{border:1px solid var(--line);background:#1a2028;padding:7px 10px;font-size:11px}.btn:hover,.workflow-chip:hover,.add-workflow:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);color:#081018;border-color:var(--blue);font-weight:800}.btn:disabled{opacity:.35;cursor:not-allowed}.pill-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.pill{border:1px solid #536476;color:var(--blue2);padding:4px 7px;background:#0d1924}.pill.prompt{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove{border:0;background:none;color:var(--muted);padding:0 0 0 6px}.ops{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.drop-zone{margin:0 12px 13px;border:1px dashed #4c6f8a;padding:13px 12px;background:#0e1a24;color:var(--muted);text-align:center}.drop-zone.over{border-color:var(--blue);background:#17334a;color:var(--ink)}.drop-zone strong{display:block;color:var(--blue);font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row .field{margin:0}.row-drop{border:1px dashed #394856;min-height:33px;margin:7px 12px 12px;padding:7px;color:var(--dim);text-align:center;font-size:11px}.row-drop.over{border-color:var(--amber);color:var(--amber)}.autosave{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 16px;color:var(--dim);font-size:11px}.autosave b{color:var(--amber);font-weight:500}.experiment-tray{margin-bottom:12px;border:1px solid #38516a;background:#101b26;padding:14px}.tray-head{display:flex;justify-content:space-between;gap:15px}.tray-head p{margin:5px 0 0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.stat{border:1px solid var(--line);padding:8px 9px;background:#151e27}.stat b{display:block;font-size:17px;margin-top:2px}.run-note{font-size:11px;color:var(--amber);padding:10px 0}.run-note.ready{color:var(--blue)}.tray-actions{display:flex;gap:7px}.axis-list{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}.axis-tag{border:1px solid var(--blue);color:var(--blue);padding:4px 7px;font-size:11px}.output{height:100%;display:flex;flex-direction:column}.status{font-size:10px;letter-spacing:.12em;color:var(--amber)}.canvas-wrap{padding:20px;display:flex;flex-direction:column;flex:1}.canvas{flex:1;min-height:500px;border:1px solid #293744;background:linear-gradient(135deg,#111820,#0b0f13 52%,#142536);display:grid;place-items:center;position:relative;overflow:hidden}.canvas:after{content:"";position:absolute;width:70%;height:1px;background:#31506a;transform:rotate(-28deg);opacity:.55}.canvas-center{z-index:1;text-align:center;background:#0d1319dd;padding:17px 21px;border:1px solid #344454}.canvas-center strong{display:block;font:22px Georgia,serif}.canvas-center span{display:block;color:var(--muted);margin-top:4px}.progress{height:3px;background:#1d2730;margin-top:17px}.progress i{display:block;width:${0};height:100%;background:var(--blue)}.output-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;padding:10px 0}.film{display:flex;gap:7px;align-items:center}.thumb{width:42px;height:30px;border:1px solid var(--line);background:#18212a}.footerbar{position:fixed;bottom:0;left:0;right:0;background:#0d1116ee;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:13px;padding:10px;backdrop-filter:blur(12px)}.footerbar button{border:1px solid var(--line);background:#171d24;padding:4px 10px}.variant-note{position:absolute;right:18px;color:var(--dim);font-size:10px}.toast{position:fixed;right:22px;bottom:52px;border:1px solid var(--blue);background:#102536;color:var(--blue2);padding:10px 13px;box-shadow:var(--shadow)}body.rail .rail-shell{display:grid;grid-template-columns:155px 1fr;min-height:600px}body.rail .rail{border-right:1px solid var(--line);padding:10px}.rail button{display:block;width:100%;text-align:left;border:0;border-left:2px solid transparent;background:none;color:var(--muted);padding:9px}.rail button.active{border-left-color:var(--blue);color:var(--blue);background:var(--blue-soft)}body.rail .detail{min-width:0}body.rail .field-groups{padding:12px}body.stage .sidebar{max-height:none}body.stage .stage-body{padding:13px}body.stage .experiment-tray{margin:0 0 13px}body.stage .field{margin-bottom:7px}body.stage .stage-body>.field:nth-of-type(n+5){display:none}@media(max-width:950px){.split{grid-template-columns:1fr}.sidebar{max-height:none}.workspace{min-height:560px}.variant-note{display:none}}@media(max-width:600px){.app{padding:18px 13px 76px}.top{display:block}.stamp{display:inline-block;margin-top:12px}.row{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main id="app" class="app"></main><nav class="footerbar" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">←</button><span id="variantLabel"></span><button id="next" aria-label="Next variant">→</button><span class="variant-note">direct-file · memory-only</span></nav>
<script>
const variants=['shelf','rail','stage'],labels={shelf:'SHELF · drag into Advanced',rail:'RAIL · move between groups',stage:'STAGE · compare the matrix'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),base=['Prompt','Output representation','Seed','UNet','VAE','CLIP / text model'],advanced=['Sampler','Steps','CFG scale','Denoise'];
const state={experiment:false,active:'Prompt',axes:new Set(),values:{Prompt:[],Seed:[],Steps:[], 'CFG scale':[]},workflows:['Portrait study / v3','Editorial still life / v2'],selected:[0,1],order:[...base,...advanced],saved:true,drag:null};
function current(){let v=new URLSearchParams(location.search).get('variant')||'shelf';return variants.includes(v)?v:'shelf'}function isNumber(n){return ['Seed','Steps','CFG scale','Denoise'].includes(n)}function input(n,axis){let v=state.values[n]?.[0]||'';if(axis)return `<div class="axis-editor"><div class="entry"><input class="value-entry" id="axis-${esc(n)}" type="${isNumber(n)?'number':'text'}" placeholder="${isNumber(n)?'Value':'Type a value'}" onkeydown="enterValue(event,'${esc(n)}')"><button class="btn" onclick="addValue('${esc(n)}')">Add</button></div><div class="pill-row">${(state.values[n]||[]).map((x,i)=>`<span class="pill ${n==='Prompt'?'prompt':''}" title="${esc(x)||'Empty value'}">${esc(x)||'Empty'} <button class="remove" aria-label="Remove value" onclick="removeValue('${esc(n)}',${i})">×</button></span>`).join('')||'<span class="meta">Enter values to vary this axis</span>'}</div>${isNumber(n)?`<div class="ops"><button class="btn" onclick="numberOp('${esc(n)}','random')">Random</button><button class="btn" onclick="numberOp('${esc(n)}','increment')">Increment</button><button class="btn" onclick="numberOp('${esc(n)}','decrement')">Decrement</button><button class="btn" onclick="numberOp('${esc(n)}','empty')">Empty</button></div>`:''}</div>`;if(n==='Prompt')return `<textarea placeholder="Write the prompt…" oninput="save('${esc(n)}',this.value)">${esc(v)}</textarea>`;if(isNumber(n))return `<input type="number" value="${esc(v)}" placeholder="Enter number" onchange="save('${esc(n)}',this.value)">`;if(n==='Output representation')return `<select onchange="save('${esc(n)}',this.value)"><option>PNG image</option><option>JPG image</option><option>Latent</option></select>`;return `<select onchange="save('${esc(n)}',this.value)"><option>Choose saved model</option><option>Studio / ${esc(n)}</option><option>Alternate / ${esc(n)}</option></select>`}
function field(n){let axis=state.experiment&&state.axes.has(n),dim=state.experiment&&!axis&&state.axes.size>0;return `<article class="field ${axis?'axis ':''}${dim?'dim':''}" draggable="true" data-field="${esc(n)}" ondragstart="startDrag(event,'${esc(n)}')" ondragend="endDrag()"><div class="field-head"><div class="field-title"><span class="drag" title="Drag to move">⠿</span><strong>${esc(n)}</strong></div>${state.experiment?`<label class="axis-check"><input type="checkbox" ${axis?'checked':''} onchange="setAxis('${esc(n)}',this.checked)"> axis</label>`:''}</div>${input(n,axis)}</article>`}
function mode(){return `<button class="mode-btn ${state.experiment?'on':''}" onclick="toggle()"><span>${state.experiment?'Exit Experiment':'Experiment'}</span><span>${state.experiment?'ACTIVE · compare + vary':'OFF · saved workflow'}</span></button>`}function workflows(){return `<div class="workflow-strip"><h3>Workflows under test</h3><div class="workflow-chips">${state.workflows.map((w,i)=>`<button class="workflow-chip ${state.selected.includes(i)?'selected':''}" onclick="selectWorkflow(${i})">${esc(w)}${state.selected.includes(i)?' <span>✓</span>':''}</button>`).join('')}<button class="add-workflow" onclick="addWorkflow()">+ Add workflow</button></div><div class="compare-note">Comparison set is separate from field axes.</div></div>`}function summary(){let counts=[...state.axes].map(n=>(state.values[n]||[]).length),axisRuns=counts.length?counts.reduce((a,b)=>a*b,1):1,ready=state.selected.length>=2&&counts.some(x=>x>=2),runs=state.selected.length*axisRuns;return `<div class="summary"><div class="stat"><span class="tiny">Workflows</span><b>${state.selected.length}</b></div><div class="stat"><span class="tiny">Axes</span><b>${state.axes.size}</b></div><div class="stat"><span class="tiny">Axis values</span><b>${counts.reduce((a,b)=>a+b,0)||0}</b></div><div class="stat"><span class="tiny">Runs</span><b>${runs||'—'}</b></div></div><div class="run-note ${ready?'ready':''}">${ready?'Ready · workflows × axis matrix.':'Run disabled · choose 2 workflows and add 2 values to an axis.'}</div><div class="tray-actions"><button class="btn primary" ${ready?'':'disabled'} onclick="toast('Comparison matrix queued in memory')">Run matrix</button><button class="btn" onclick="clearAxes()">Clear axes</button></div>`}function tray(){return `<section class="experiment-tray"><div class="tray-head"><div><div class="kicker">Experiment mode</div><h2>Separate comparison from variation</h2><p class="meta">${state.selected.length} workflows × selected field axes</p></div><span class="tiny">memory only</span></div>${summary()}</section>`}
function autosave(){return `<div class="autosave"><span>Layout follows this workflow type</span><b id="saveStatus">${state.saved?'Autosaved':'Saving…'}</b></div>`}function groups(){return `<div class="field-group"><div class="group-label">Primary bindings <span>drag to move</span></div>${state.order.filter(n=>base.includes(n)).map(field).join('')}</div><div class="field-group"><div class="group-label">Advanced bindings <span>saved workflow fields</span></div>${state.order.filter(n=>advanced.includes(n)).map(field).join('')}</div>`}function shelf(){return `<aside class="sidebar">${mode()}${state.experiment?workflows()+tray():''}<section class="panel"><div class="left-header"><div><div class="kicker">Saved workflow</div><h2>Portrait study / v3</h2><div class="meta">Bound fields from workflow creation</div></div><span class="tiny">${state.experiment?'axis editor':'layout'}</span></div><div class="variant-copy"><strong>Shelf composition</strong>Drag a bound field into Advanced, then place fields side by side in a row.</div><div class="fields">${groups()}</div><div class="drop-zone" ondragover="allowDrop(event)" ondrop="dropAdvanced(event)"><strong>Advanced destination</strong>Drop a field here to move it into the Advanced group.</div><div class="row-drop" ondragover="allowDrop(event)" ondrop="dropRow(event)">Drop beside another field to create a row</div>${autosave()}</section></aside>`}function rail(){return `<aside class="sidebar">${mode()}${state.experiment?workflows()+tray():''}<section class="panel rail-shell"><nav class="rail" aria-label="Bound field groups"><div class="group-label">Primary</div>${state.order.filter(n=>base.includes(n)).map(n=>`<button class="${state.active===n?'active':''}" onclick="state.active='${esc(n)}';render()">${esc(n)}</button>`).join('')}<div class="group-label" style="margin-top:18px">Advanced</div>${state.order.filter(n=>advanced.includes(n)).map(n=>`<button class="${state.active===n?'active':''}" onclick="state.active='${esc(n)}';render()">${esc(n)}</button>`).join('')}</nav><div class="detail"><div class="left-header"><div><div class="kicker">Bound field</div><h2>${esc(state.active)}</h2><div class="meta">Drag handle moves this field between groups.</div></div></div><div class="fields">${field(state.active)}</div><div class="drop-zone" ondragover="allowDrop(event)" ondrop="dropAdvanced(event)"><strong>Advanced destination</strong>Drop the selected field here.</div><div class="row-drop" ondragover="allowDrop(event)" ondrop="dropRow(event)">Drop beside another field to group</div>${autosave()}</div></section></aside>`}function stage(){return `<aside class="sidebar">${mode()}${state.experiment?workflows()+tray():''}<section class="panel"><div class="stage-head"><div><div class="kicker">Authoring stage</div><h2>Portrait study / v3</h2><div class="meta">Layout autosaves with this workflow type</div></div><span class="tiny">${state.experiment?'matrix tray':'single run'}</span></div><div class="stage-body">${state.experiment?`<div class="axis-list">${[...state.axes].map(n=>`<span class="axis-tag">${esc(n)} · ${(state.values[n]||[]).length}</span>`).join('')||'<span class="meta">Select axes below.</span>'}</div>`:''}${groups()}${autosave()}</div></section></aside>`}
function workspace(){return `<section class="workspace"><div class="panel output"><div class="output-top"><div><div class="kicker">Persistent output workspace</div><h2>Generated image</h2><div class="meta">Output stays in view while you shape the run.</div></div><span class="status">${state.experiment?'EXPERIMENT PREVIEW':'READY · 0 IMAGES'}</span></div><div class="canvas-wrap"><div class="canvas" role="img" aria-label="Output canvas placeholder"><div class="canvas-center"><strong>Output canvas</strong><span>Run the saved workflow to render here</span></div></div><div class="progress"><i></i></div><div class="output-meta"><span>Idle · saved workflow loaded</span><span>512 × 512 · PNG</span></div><div class="film"><span class="thumb"></span><span class="thumb"></span><span class="thumb"></span><span class="meta">Recent output · empty</span></div></div></div></section>`}
function render(){let v=current();document.body.className=v;document.getElementById('variantLabel').innerHTML=`<b>${labels[v]}</b>`;document.getElementById('app').innerHTML=`<header class="top"><div><div class="eyebrow">Studio / Playground</div><h1>One saved workflow.<br>Many intentional runs.</h1><p>Arrange bound fields on the left. Keep the result visible on the right.</p></div><div class="stamp">PROTOTYPE · MEMORY ONLY</div></header><div class="brief"><b>${v==='shelf'?'Question: can layout make Advanced feel tangible?':v==='rail'?'Question: can field groups make comparison faster?':'Question: can a matrix tray make workflow comparison deliberate?'}</b> &nbsp; The Playground edits saved bindings; it never creates fields or workflows.</div><div class="split">${v==='shelf'?shelf():v==='rail'?rail():stage()}${workspace()}</div>`}
function toggle(){state.experiment=!state.experiment;render()}function selectWorkflow(i){state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i];render()}function addWorkflow(){let i=state.workflows.length+1;state.workflows.push(`Color study / v${i}`);state.selected.push(i-1);render();toast('Workflow added to comparison set')}function setAxis(n,on){on?state.axes.add(n):state.axes.delete(n);render()}function save(n,v){state.values[n]=[v];state.saved=false;render();setTimeout(()=>{state.saved=true;render()},450)}function enterValue(e,n){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addValue(n)}}function addValue(n){let e=document.getElementById('axis-'+n);if(!e||!e.value.trim())return;(state.values[n]??=[]).push(e.value.trim());render()}function removeValue(n,i){state.values[n].splice(i,1);render()}function numberOp(n,op){let a=state.values[n]||[],last=Number(a[a.length-1]||7.5);if(op==='empty')a.push('');else if(op==='random')a.push(String([1,7.5,12,20][Math.floor(Math.random()*4)]));else a.push(String(Math.max(0,last+(op==='increment'?1:-1))));state.values[n]=a;render()}function startDrag(e,n){state.drag=n;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',n)}function endDrag(){state.drag=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))}function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('over')}function dropAdvanced(e){e.preventDefault();let n=state.drag||e.dataTransfer.getData('text/plain');if(!n)return;state.order=state.order.filter(x=>x!==n);state.order.push(n);state.saved=false;render();setTimeout(()=>{state.saved=true;render()},500);toast(`${n} moved to Advanced`)}function dropRow(e){e.preventDefault();let n=state.drag||e.dataTransfer.getData('text/plain');if(!n)return;toast(`${n} grouped beside its neighbor`);endDrag()}function clearAxes(){state.axes.clear();render()}function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}function cycle(d){let v=variants[(variants.indexOf(current())+d+variants.length)%variants.length];location.href=location.pathname+'?variant='+v}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);render();
</script></body></html>
<script>
/* Prototype-only row grouping enhancement: a drop makes the grouping visible. */
state.rows=[];
state.advancedSet=new Set(advanced);
function grouped(names){let used=new Set();return names.map(n=>{let row=state.rows.find(r=>r.includes(n));if(row){if(used.has(row))return '';used.add(row);return `<div class="row">${row.filter(x=>names.includes(x)).map(field).join('')}</div>`}return field(n)}).join('')}
function groups(){return `<div class="field-group"><div class="group-label">Primary bindings <span>drag to move</span></div>${grouped(state.order.filter(n=>!state.advancedSet.has(n)))}</div><div class="field-group"><div class="group-label">Advanced bindings <span>saved workflow fields</span></div>${grouped(state.order.filter(n=>state.advancedSet.has(n)))}</div>`}
function dropAdvanced(e){e.preventDefault();let n=state.drag||e.dataTransfer.getData('text/plain');if(!n)return;state.advancedSet.add(n);state.order=state.order.filter(x=>x!==n);state.order.push(n);state.saved=false;render();setTimeout(()=>{state.saved=true;render()},500);toast(`${n} moved to Advanced`)}
function dropRow(e){e.preventDefault();let n=state.drag||e.dataTransfer.getData('text/plain');if(!n)return;let row=state.rows.find(r=>r.includes(n));if(!row){let peer=(advanced.includes(n)?state.order.find(x=>advanced.includes(x)&&x!==n):state.order.find(x=>base.includes(x)&&x!==n))||state.order.find(x=>x!==n);state.rows.push([peer,n])}else if(!row.includes(n))row.push(n);state.saved=false;render();setTimeout(()=>{state.saved=true;render()},500);toast(`${n} grouped beside another field`)}
function dropPrimary(e){e.preventDefault();let n=state.drag||e.dataTransfer.getData('text/plain');if(!n)return;state.advancedSet.delete(n);state.saved=false;render();setTimeout(()=>{state.saved=true;render()},500);toast(`${n} moved to Primary`)}
const baseRender=render;render=function(){baseRender();if(current()==='rail'){let d=document.querySelector('.detail'),z=document.createElement('div');z.className='drop-zone';z.innerHTML='<strong>Primary destination</strong>Drop a bound field here to move it out of Advanced.';z.ondragover=allowDrop;z.ondrop=dropPrimary;d?.append(z)}};
render();
</script>
