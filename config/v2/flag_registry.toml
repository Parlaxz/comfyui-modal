# v2ctl flag registry — METADATA, NOT A WHITELIST (design §7).
#
# This file records the real V2 flags found in the Phase-0 audit so the CLI
# can explain them, validate their values, and reason about lifecycle.
# Unknown flags are deliberately NOT rejected here; they flow through as
# unregistered (unknown is allowed; unknown is not trusted).
#
# Lifecycle axes (design §7.1):
#   consumed_at      where the code reads the flag
#                    (build|module_import|restore|method_entry|request|harness)
#   change_requires  what a changed value needs to take effect
#                    (build|deploy|run|none|unknown)
#
# Sources for this phase (best-effort pending remote parity):
#   - request-carried:  comfymodal_runtime/modal_app.py:562
#                       _REQUEST_DIAGNOSTIC_ENV_ALLOWLIST
#   - deploy-baked:     deploy_and_run_v2_single.bat + modal_app.py:2941
#                       _runtime_env()
#   - harness selectors:tools/benchmark_v2_direct.py + deploy_and_run_v2_single.bat

schema_version = 1

