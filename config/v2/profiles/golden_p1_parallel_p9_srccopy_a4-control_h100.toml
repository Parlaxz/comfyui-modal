# v2ctl profile: contemporaneous P9 source population CONTROL arm A on H100.
#
# DIAGNOSTIC EXPERIMENT.  This is arm A -- the unchanged production-shaped
# control -- on its own app, deployed at the same time as arm A4 and from the
# same source, so that A and A4 differ by exactly one variable.
#
#   ARM A   control    whole-file MAP_PRIVATE mmap, no treatment  (this profile)
#   ARM A4  treatment  + synchronous full-file positioned read, then the same mmap
#
# Why this exists as a separate app rather than reusing
# golden_p1_parallel_p9_srccopy_a-control_h100 from the A2/A3 phase: that app is
# deployed from an older source identity.  Pooling its containers with A4's would
# present two code states as one homogeneous cohort, which is exactly the mistake
# the per-deployment cohort keying in tools/source_copy_isolation_report.py was
# added to prevent.  A control is only a control if it is contemporaneous.
#
# ARM DEFINITION (no treatment at all):
#
#       open source fd
#           -> whole-file MAP_PRIVATE mmap
#           -> existing production reader loop (4 readers, 64 MiB blocks,
#              4 ms pacer, 16 x 64 MiB pinned shared arena)
#           -> libc.memmove from the mapping into the arena slot
#
#   No warmup.  No fadvise, no madvise, no MAP_POPULATE, no positioned read.
#   The process-local COMFYMODAL_GOLDEN_SOURCE_COPY_ISOLATION_POPULATION is still
#   raised around the experiment's own build_plan call -- both arms get the exact
#   same gating -- but arm A's policy hook records warm_read_called=false and
#   performs no read, which is what makes "the control never warmed" provable
#   rather than assumed.
#
# Everything else is inherited from golden_p1_parallel_p9_srccopy_iso_h100 and
# therefore from golden_p1_parallel_p9opt1_source_diag_h100 and
# golden_p1_parallel_c0_p8_h100:
#
#   H100! / CPU=12 / memory 24576 MB
#   whole mmap lifecycle                   COMFYMODAL_GOLDEN_C0_MMAP_LIFECYCLE=whole
#   thread source owner                    COMFYMODAL_GOLDEN_C0_SOURCE_WORKER_KIND=thread
#   qd4_64 source/transport geometry       64 MiB blocks, 16 x 64 MiB arena
#   per-copy stall probe                   COMFYMODAL_GOLDEN_SOURCE_COPY_PROBE=1
#   forced-miss conditioning               [workload] conditioning_cache=forced_miss
#   fresh-run requirement                  [workload] fresh_required=true
#   correctness SHA                        3a6a03064c7e6e01ede339ada63daaea4cbf793f387f4faadbb101a787024577
#
# This profile is NOT counted and NOT promotable.
schema_version = 1
name = "golden_p1_parallel_p9_srccopy_a4-control_h100"
extends = "golden_p1_parallel_p9_srccopy_iso_h100"
owner = "p9-source-copy-isolation"

[target]
app = "batch-p9srccopy-a4-control-h100"
class = "ModalRuntimeEntrypointV2"
method = "run_golden_parallel_stream"

[environment]
COMFYMODAL_GOLDEN_SOURCE_COPY_ISOLATION_ARM = "A"
