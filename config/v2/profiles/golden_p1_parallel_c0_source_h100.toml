# v2ctl profile: Golden Parallel on H100 with the C0 source owner.
#
# This is the COUNTED PERFORMANCE profile.  It carries no intrusive
# diagnostics: no child VizTracer, no per-window/per-operation trace, no
# decomposition hooks.  Only fixed, preallocated counters needed to prove
# identity, correctness, source wall, concurrency, waits and coverage remain.
#
# Identity is explicit rather than inherited through a historical M2 profile,
# so the resolved configuration unambiguously describes the arm that runs.
# See the sibling *_diagnostic profile for stage decomposition.
schema_version = 1
name = "golden_p1_parallel_c0_source_h100"
extends = "golden_p1_parallel"
owner = "golden-c0-source"

[target]
app = "batch-c0-source-h100"
class = "ModalRuntimeEntrypointV2"
method = "run_golden_parallel_stream"

[resources]
gpu = "H100!"
cpu = 12
memory_mb = 24576

[workload]
fresh_required = true
conditioning_cache = "forced_miss"
expected_output_sha = "3a6a03064c7e6e01ede339ada63daaea4cbf793f387f4faadbb101a787024577"
run_count = 1
gap_seconds = 35.0

[environment]
COMFYMODAL_V2_MEMORY_MB = "24576"
COMFYMODAL_V2_MEMORY_REQUEST = "24576"
COMFYMODAL_V2_BASELINE_MEMORY_REQUEST = "24576"
COMFYMODAL_V2_CPU_REQUEST = "12"

# ── Execution identity ───────────────────────────────────────────────────
# Execution body: C0 parallel.  The source side is a CUDA-sterile source
# owner; H2D is the C0 dispatcher.
COMFYMODAL_GOLDEN_MODEL_TRANSPORT = "1"
COMFYMODAL_GOLDEN_CLIP_LOADER = "m2"
COMFYMODAL_GOLDEN_CLIP_UNET_SCHEDULE = "overlap"
COMFYMODAL_GOLDEN_SAMPLING_VAE_SCHEDULE = "overlap"
COMFYMODAL_GOLDEN_CLIP_SKELETON_OVERLAP = "1"

# ── Source architecture (explicit, fail-closed) ──────────────────────────
# One source owner process; its readers self-service every 64 MiB extent.
COMFYMODAL_GOLDEN_C0_SOURCE_THREADS = "1"
# "thread"  = one source owner, four reader threads (one address space).
# "process" = one CUDA-sterile supervisor, four independent persistent reader
#             processes (one address space, one descriptor, one mapping each).
COMFYMODAL_GOLDEN_C0_SOURCE_WORKER_KIND = "thread"
# "fresh" = exact-window mmap + sync munmap per block.  DIAGNOSTIC ARM ONLY.
#   The per-op munmap drops the mapping before the next op claims, so every
#   64 MiB extent re-faults from the volume: measured source throughput
#   collapses 10-40x (0.145-1.597 GB/s vs 6.2-6.4 GB/s) while still returning
#   the exact output SHA, valid=true, fallback=0.  Never a production value.
# "whole" = one read-only MAP_PRIVATE whole-file mapping per address space,
#   mapped once per model generation and reused by every reader op.
COMFYMODAL_GOLDEN_C0_MMAP_LIFECYCLE = "whole"

# ── Frozen C0 geometry and source kernel ─────────────────────────────────
COMFYMODAL_GOLDEN_IO_PROCESS_V2 = "1"
COMFYMODAL_GOLDEN_IO_PROCESS_V2_BACKING = "posix"
COMFYMODAL_GOLDEN_IO_PROCESS_V2_STREAMING = "1"
COMFYMODAL_GOLDEN_IO_PROCESS_V2_PERSISTENT_FDS = "1"
# Native mmap + native memcpy, never preadv.  This is the *engine* axis and is
# independent of the fresh|whole *lifecycle* axis above.
COMFYMODAL_GOLDEN_IO_PROCESS_V2_SOURCE_ENGINE = "mmap_fresh"
COMFYMODAL_GOLDEN_IO_PROCESS_V2_SOURCE_GEOMETRY = "qd4_64"
COMFYMODAL_GOLDEN_C0_TRANSPORT_GEOMETRY = "qd4_64"
COMFYMODAL_GOLDEN_C0_HOST_REGISTER = "1"
COMFYMODAL_GOLDEN_COMPLETION_EVENT_LIFETIME = "one_shot_events"
COMFYMODAL_GOLDEN_MINIMAL_RESTORE = "1"

# ── Post-request teardown ─────────────────────────────────────────────────
# Every counted run here is single-use (min_containers=0): Modal destroys the
# container immediately after the method returns, so there is no next request to
# release a GPU for.  The full post-request path still runs by default because
# COMFYMODAL_V2_RELEASE_GPU_AFTER_REQUEST resolves to 1 by ambient inheritance,
# which overrides _release_gpu_after_request's own single-use default and forces
# unload_all_models + the reference-clear stages.  That is a multi-second,
# load-proportional tail on the container wall after the result is already
# durable, and it is pure overhead on a container about to be deleted.
# Minimal teardown keeps the cheap branches and drops the heavyweight unload.
COMFYMODAL_V2_MINIMAL_GPU_TEARDOWN = "1"

# ── Counted profile: all intrusive diagnostics OFF ───────────────────────
# Child VizTracer.  full_execution_trace.py imports and starts VizTracer as
# soon as this is 1, so it is not a capability flag for a counted request.
COMFYMODAL_V2_FULL_TRACE = "0"
# Per-operation E27 forensics patching.
COMFYMODAL_V2_E27_FORENSICS = "0"
# Per-window source trace (allocates and retains per-fill raw records).
COMFYMODAL_GOLDEN_C0_WINDOW_TRACE = "0"
# Golden stage / CLIP decomposition hooks.
COMFYMODAL_GOLDEN_STAGE_DIAGNOSTICS = "0"
# Sampling deep-profile monkeypatching.
COMFYMODAL_SAMPLING_DEEP_PROFILE = "off"
# Mmap copy distribution diagnostics.
COMFYMODAL_GOLDEN_IO_PROCESS_V2_MMAP_COPY_DIAG = "0"

# ── Cheap fixed counters kept for identity and coverage proof ────────────
# Preallocated Gantt stamps only; no per-operation trace records.
COMFYMODAL_V2_GANTT_TELEMETRY = "1"
