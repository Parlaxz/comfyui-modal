# v2ctl profile: P9 source-copy isolation, ARM D on H100.
#
# DIAGNOSTIC EXPERIMENT.  One arm of the 2x2 source/destination 64 MiB copy
# isolation, on its own app so the arm is a deploy-level identity rather than a
# run-time override.
#
#   ARM D: host control, ordinary anonymous RAM -> ordinary anonymous RAM
#
# Why the arm is DEPLOY-baked rather than a run-only --set override: the
# container reads COMFYMODAL_GOLDEN_SOURCE_COPY_ISOLATION_ARM from the class
# environment, which _runtime_env() freezes at deploy time. A run-only override
# changes the run fingerprint and then never reaches the container, so all four
# arms silently execute as arm A. That was measured, not assumed: fifteen
# requests requested as B, C and D all executed arm A with a clean source
# identity, a clean gate and a valid result. Each arm therefore owns a profile
# and an app, and the arm is provable from the deployed fingerprint alone.
#
# Everything else is inherited from golden_p1_parallel_p9_srccopy_iso_h100 and
# therefore from golden_p1_parallel_p9opt1_source_diag_h100 and
# golden_p1_parallel_c0_p8_h100:
#
#   H100! / CPU=12 / memory 24576 MB
#   whole mmap lifecycle                   COMFYMODAL_GOLDEN_C0_MMAP_LIFECYCLE=whole
#   thread source owner                    COMFYMODAL_GOLDEN_C0_SOURCE_WORKER_KIND=thread
#   qd4_64 source/transport geometry       64 MiB blocks, 16 x 64 MiB arena
#   per-copy stall probe                   COMFYMODAL_GOLDEN_SOURCE_COPY_PROBE=1
#   forced-miss conditioning               [workload] conditioning_cache=forced_miss
#   fresh-run requirement                  [workload] fresh_required=true
#   correctness SHA                        3a6a03064c7e6e01ede339ada63daaea4cbf793f387f4faadbb101a787024577
#
# Source behaviour is unchanged: no posix_fadvise, no readahead, no
# MADV_WILLNEED, no MADV_HUGEPAGE, no mlock, no NUMA binding, no CPU affinity,
# no extra readers, and no change to QD, block size, pacer or mmap lifecycle.
#
# This profile is NOT counted and NOT promotable.
schema_version = 1
name = "golden_p1_parallel_p9_srccopy_iso_d_h100"
extends = "golden_p1_parallel_p9_srccopy_iso_h100"
owner = "p9-source-copy-isolation"

[target]
app = "batch-p9srccopy-d-h100"
class = "ModalRuntimeEntrypointV2"
method = "run_golden_parallel_stream"

[environment]
COMFYMODAL_GOLDEN_SOURCE_COPY_ISOLATION_ARM = "D"
