# v2ctl profile: R43 restore of historically proven fast request-time loaders
# (E28/E37 era). Extends r42-golden-qd4 with the Golden pipeline disabled so
# the legacy fast loader arms are nominal again. Restore/snapshot untouched.
schema_version = 1
name = "r43-known-fast"
extends = "r42-golden-qd4"
owner = "R43"

[workload]
fresh_required = true
conditioning_cache = "forced_miss"
expected_output_sha = "20b10e1f99831bc758d9df82f43ce0beb1cbc636a740d11a29eb2bffe90e5260"
run_count = 1
gap_seconds = 35.0

[runtime_overrides]
policy = "forbid"

[environment]
# R43: restore the historically proven E37 clean-lane fast shape. CLIP and
# UNET weights ride the memory snapshot (zero request-time model file IO);
# VAE stays native at request time. Restore/snapshot machinery untouched.
COMFYMODAL_GOLDEN_PIPELINE = "0"
COMFYMODAL_V2_CLIP_QD_READER = "0"
COMFYMODAL_V2_CLIP_FAST_HYDRATION = "0"
COMFYMODAL_V2_CLIP_SNAPSHOT_EXCLUDE_WEIGHTS = "0"
COMFYMODAL_V2_SNAPSHOT_EXCLUDE_UNET = "0"
COMFYMODAL_V2_UNET_FASTSAFETENSORS = "0"
COMFYMODAL_V2_FAST_COLD_ORCHESTRATION = "0"
COMFYMODAL_V2_CHECKPOINT_PREWARM = "0"
COMFYMODAL_V2_CHECKPOINT_PREWARM_THREADS = "0"
COMFYMODAL_V2_CHECKPOINT_PREWARM_CHUNK_MB = "0"
