# v2ctl profile: ISOLATED Ideogram 4 Comfy UI Default on exact H100.
#
# Canonical workflow-selection + exact-placement experiment profile. It proves
# a v2ctl run resolves workflow wf_81513286bb304e9f /
# wv_f3baf54d8f784b64 ("Ideogram 4 Comfy UI Default") onto one pinned H100
# with no fallback pool and an explicit cloud+region pin.
#
# Isolation contract (do NOT "fix" by sharing):
# - unique testing app ideogram4-h100-profile-20261015: never the stable
#   production app, never default stable-modal-comfy-v2-shadow, never a
#   golden_p1 app. Legal Modal name (lowercase, digits, hyphens).
# - gpu exactly "h100!": NO gpu_alt, NO gpu_fallbacks. Single-function
#   deploy; a missing H100 fails loudly instead of sliding to another GPU.
# - explicit COMFYMODAL_V2_CLOUD + COMFYMODAL_V2_REGION deploy pins
#   (narrower than golden_p1's broad "us"; do NOT copy golden_p1's
#   fallback pool or broad-us pin as-is).
# - generic run_plan_stream method: the Golden serial method is hardcoded to
#   its own reference workflow and cannot execute this Studio graph.
#
# Steps provenance: the stored graph "Default" preset is 20 steps
# (.studio_workflows.json, node 98 "Default" preset). The task hard invariant
# is 16 steps. v2ctl NEVER rewrites the graph: steps default to the graph
# value unless the caller passes COMFYMODAL_V2_WORKFLOW_STEPS=16 explicitly,
# and graph-default vs requested vs effective is recorded in dry-run output,
# run manifests, and provenance. Real (non-dry-run) dispatch on this profile
# additionally refuses any effective step count other than 16.
#
# Pinned graph invariants (recorded, never modified by v2ctl): sampler euler,
# scheduler Ideogram4Scheduler, CFG 7 + CFGOverride 3 @ 70-100%,
# DualModelGuider, 1024x1024, seed 71584314815009, models
# ideogram4_int8_convrot + ideogram4_unconditional_int8_convrot.
#
# Revert: delete this file + the three COMFYMODAL_V2_WORKFLOW_* registry
# flags. Nothing else references this profile.
schema_version = 1
name = "ideogram4_h100_20261015"
extends = "production"
owner = "ideogram-h100"

[target]
app = "ideogram4-h100-profile-20261015"
class = "ModalRuntimeEntrypointV2"
method = "run_plan_stream"

[resources]
gpu = "h100!"
cpu = 12
memory_mb = 24576
min_containers = 0
# Scaledown is in seconds: containers exit ~1s after use (cost-owned; every
# run cold-starts by design, no idle H100 billing).
scaledown_window = 1

[workload]
fresh_required = true
conditioning_cache = "forced_miss"
expected_output_sha = ""
# Exactly one request per invocation (never a hidden multi-run campaign).
run_count = 1
gap_seconds = 35.0

[runtime_overrides]
policy = "forbid"

[environment]
# ── model-free snapshot (do NOT bake CLIP/UNET/VAE into the snapshot) ──
# Production base mandates COMFYMODAL_V2_ENV_PROFILE=production, which in
# turn REQUIRES COMFYMODAL_V2_CPU_MODEL_SNAPSHOT=1 (RuntimeError otherwise)
# — that pair is what turned every capture into 20GB of slow legacy reads.
# run_plan_stream itself needs no baked models (the restore-only default app
# runs it on inherit): use inherit + snapshot off so captures stay ~50s and
# models load per-request like every normal deployment.
COMFYMODAL_V2_ENV_PROFILE = "inherit"
COMFYMODAL_V2_CPU_MODEL_SNAPSHOT = "0"
COMFYMODAL_V2_VAE_SNAPSHOT = "0"
# ── memory (deploy-baked; keep all three pinned to [resources].memory_mb) ──
# Convention from source_race_h100/golden_p1: inherited production values
# (8192) must not disagree with the override above. Shape matches the
# known-good c0 H100 profile (cpu 12 / mem 24576) so snapshot builds holding
# 2x INT8 UNET + FP8 CLIP + VAE do not OOM a small container.
COMFYMODAL_V2_MEMORY_MB = "24576"
COMFYMODAL_V2_MEMORY_REQUEST = "24576"
COMFYMODAL_V2_BASELINE_MEMORY_REQUEST = "24576"
COMFYMODAL_V2_CPU_REQUEST = "12"
# ── exact placement (deploy-baked; redeploy on change) ────────────────
# Single region pin "us" (not "us-central"); no cloud pin. Matches the
# Golden convention (golden_p1.toml): cloud pinning is not supported.
COMFYMODAL_V2_REGION = "us"
# ── ported c0 optimizations (ONLY flags proven to engage on run_plan_stream)
# A gating survey (consumers in modal_app/generic-loaders/clip-qd-reader)
# showed all COMFYMODAL_GOLDEN_* transport/schedule/C0/IO-process flags are
# INERT without Golden orchestration (DynamicVRAM), so they were removed.
# These engage without it:
# - MINIMAL_GPU_TEARDOWN: V2 teardown policy, method-independent.
# - CLIP_QD_READER / GENERIC_OVERLAP: consumed by generic loader selection.
# - GOLDEN_ATTENTION_BACKEND=comfy_kitchen: read on stream execution. This is
#   not a tuning extra: the task baseline assumes attention_comfy_kitchen_int8
#   (1088 calls) but our runs resolved attention "missing". Restoring it is
#   baseline correctness.
COMFYMODAL_V2_MINIMAL_GPU_TEARDOWN = "1"
COMFYMODAL_V2_CLIP_QD_READER = "1"
COMFYMODAL_V2_GENERIC_OVERLAP = "1"
COMFYMODAL_V2_GOLDEN_ATTENTION_BACKEND = "comfy_kitchen"
# ── CUDA profiler (deploy-baked for the profiled run only) ────────────
# The hooks read container os.environ; request --set does not reach the
# container (strict request-diagnostic allowlist). Bake torch/iter3/blocks
# for exactly one profiled run, then revert to off + redeploy.
# Validation runs stay unprofiled: honest s/it, no profiler perturbation.
COMFYMODAL_V2_IDEOGRAM_CUDA_PROFILE = "off"
# Comfy disables the kitchen Triton backend by default; the container ships
# triton via the cu130 torch dependency and H100 satisfies the SM80+ INT8
# constraint. Registry priority (cuda > triton > eager) keeps this a no-op
# wherever the native CUDA path serves; elsewhere Triton outranks eager.
COMFYMODAL_V2_ENABLE_TRITON_BACKEND = "1"
# ── canonical workflow selection (request-scoped; no redeploy on change) ─
COMFYMODAL_V2_WORKFLOW_ID = "wf_81513286bb304e9f"
COMFYMODAL_V2_WORKFLOW_VERSION_ID = "wv_f3baf54d8f784b64"
# COMFYMODAL_V2_WORKFLOW_STEPS intentionally unset (= 0 = stored graph
# default, 20 steps). The invariant run passes 16 explicitly per invocation.
# ── torch.compile validation control (opt-in ONLY; default OFF) ─────────
# Compile stays off unless explicitly enabled per run: regional/full
# requires a deliberate COMFYMODAL_TORCH_COMPILE_MODE override (run-scoped,
# no redeploy). These pinned OFF values keep validation runs byte-identical
# to production unless the operator opts into compile explicitly.
COMFYMODAL_TORCH_COMPILE_MODE = "off"
COMFYMODAL_TORCH_COMPILE_DYNAMIC = "auto"
COMFYMODAL_TORCH_COMPILE_DEBUG = "0"
COMFYMODAL_TORCH_COMPILE_RECOMPILE_LIMIT = "8"
