# v2ctl profile: physical source-copy diagnostics, H100. Default OFF.
#
# Ported from the M1B diagnostic branch so future experiments inherit the
# corrected harness instead of rediscovering its bugs.  Two properties are
# deliberate and were both learned the hard way:
#
#  * The probe is default OFF.  Nothing here changes Golden behaviour unless
#    COMFYMODAL_M1B_COPY_PROBE is explicitly set to 1.
#  * It targets a SEPARATE diagnostic app.  The production-006 anchor is never
#    mutated, and this profile must never be used for a counted or performance
#    claim.
#
# Level 1 = minimal inline sentinel (anonymous first-touch vs repeat).
# Level 2 = adds the file-backed arms and the shared destination.
#
# The probe runs at each entrypoint's post-durability point (see the hook in
# golden_parallel), where generation is complete, the result is committed, and
# the source owner is idle.
schema_version = 1
name = "golden_p1_parallel_c0_copydiag_h100"
extends = "golden_p1_parallel_c0_source_h100"
owner = "m1b-correctness-port"

[target]
app = "batch-c0-copydiag-h100"

[workload]
run_count = 1

[environment]
COMFYMODAL_M1B_COPY_PROBE = "0"
COMFYMODAL_M1B_LEVEL = "1"